[package]
name = "annas-mcp"
version = "0.2.0"
edition = "2021"
description = "A high-performance Rust MCP server and CLI for Anna's Archive with dynamic SLUM mirror discovery, SciDB/DOI lookups, and fast downloads."
authors = [
    "Shayneeo",
    "Iosifache (https://github.com/iosifache/annas-mcp)",
    "Abhinav Prabhakar (https://github.com/Abhinav-Prabhakar/AnnasArchiveMCP)",
    "Remi Kalbe (https://github.com/remikalbe/annas-archive-mcp)"
]
license = "MIT"
readme = "README.md"
repository = "https://github.com/ShayNeeo/annas-mcp"
keywords = ["mcp", "model-context-protocol", "annas-archive", "books", "scidb"]
categories = ["command-line-utilities", "network-programming"]

[lib]
name = "annas_mcp"
path = "src/lib.rs"

[[bin]]
name = "annas-mcp"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "cookies"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
scraper = "0.20"
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "1.0"
url = { version = "2.5", features = ["serde"] }
urlencoding = "2.1"
regex = "1.10"
dotenvy = "0.15"
directories = "5.0"
futures-util = "0.3"

[dev-dependencies]
tokio = { version = "1.38", features = ["macros", "rt-multi-thread"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
